name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes ajv-cli@5 validate --spec=draft2020 -s catalog.schema.json -d catalog.json
      - name: Reject plugin binaries
        run: |
          if find . -type f -name '*.jar' -print -quit | grep -q .; then
            echo 'JAR files must be release assets, never committed.' >&2
            exit 1
          fi
